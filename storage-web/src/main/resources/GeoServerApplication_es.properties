StorageUriValidator.invalidUri=No es una ubicaci\u00f3n de almacenamiento reconocida. Use una ruta local, un URI file:, una URL http(s): o un URI con un esquema admitido por un proveedor de almacenamiento (p. ej., s3:, gs:, azure:).

# Tooltips of the storage parameters. The English ones are the descriptions declared by tileverse-storage.
storage.caching.enabled.tooltip=Habilita la cach\u00e9 en memoria de rangos de bytes sin procesar. Un rango almacenado en cach\u00e9 se vuelve a servir sin acceder al origen, y las solicitudes simult\u00e1neas del mismo rango a trav\u00e9s de un mismo lector comparten una sola recuperaci\u00f3n. Deshabilitada de forma predeterminada.
storage.http.timeout-millis.tooltip=Especifica el tiempo m\u00e1ximo de espera al establecer una conexi\u00f3n con el servidor HTTP.\nEl valor predeterminado es 5000 milisegundos (5 segundos). Aumente este valor en redes lentas o poco fiables.
storage.http.trust-all-certificates.tooltip=Cuando se establece en true, deshabilita la validaci\u00f3n de certificados SSL/TLS, lo que permite conexiones a servidores\ncon certificados autofirmados o no v\u00e1lidos. SOLO debe usarse en entornos de\ndesarrollo/pruebas. El valor predeterminado es false (validaci\u00f3n de certificados habilitada).
storage.http.username.tooltip=Nombre de usuario para la autenticaci\u00f3n b\u00e1sica HTTP. Debe usarse junto con el par\u00e1metro de contrase\u00f1a de autenticaci\u00f3n b\u00e1sica HTTP.
storage.http.password.tooltip=Contrase\u00f1a para la autenticaci\u00f3n b\u00e1sica HTTP. Debe usarse junto con el par\u00e1metro de usuario de autenticaci\u00f3n b\u00e1sica HTTP.
storage.http.bearer-token.tooltip=Token de portador para la autenticaci\u00f3n OAuth 2.0 o JWT. El token se env\u00eda con cada solicitud usando el formato de encabezado "Authorization: Bearer <token>".\n\nSe usa habitualmente con API REST modernas y servicios en la nube.
storage.http.api-key-headername.tooltip=El nombre del encabezado HTTP que se usa para la autenticaci\u00f3n con clave de API (p. ej., "X-API-Key", "Authorization", "api-key"). Debe usarse junto con el par\u00e1metro api-key.\n\nHabitual en las API REST que usan autenticaci\u00f3n basada en encabezados personalizados.
storage.http.api-key.tooltip=El valor de la clave de API que se env\u00eda en el encabezado personalizado. Debe usarse junto con el par\u00e1metro api-key-headername. Opcionalmente, puede incluir un prefijo especificado mediante el par\u00e1metro "Prefijo del valor de la clave de API" (p. ej., "ApiKey " o "Token ").
storage.http.api-key-value-prefix.tooltip=Prefijo opcional para el valor de la clave de API (p. ej., "ApiKey ", "Token "). Si se especifica, este prefijo se antepone a la clave de API antes de enviarla en el encabezado.\n\nEjemplo: el prefijo "ApiKey " con la clave "abc123" da como resultado el valor de encabezado "ApiKey abc123".
storage.s3.force-path-style.tooltip=Cuando est\u00e1 habilitado, las solicitudes usan el direccionamiento de estilo de ruta (p. ej., https://s3.amazonaws.com/bucket/key).\n\nCuando est\u00e1 deshabilitado, se usa en su lugar el direccionamiento de estilo de alojamiento virtual (p. ej., https://bucket.s3.amazonaws.com/key).\n\nPuede resultar \u00fatil para la compatibilidad con sistemas de almacenamiento compatibles con S3 que no admiten solicitudes de estilo de alojamiento virtual.\n\nSin valor, se usa el estilo de ruta cuando rige un punto de conexi\u00f3n personalizado (storage.s3.endpoint, el host de una URL http(s) de un servicio compatible con S3 como MinIO, o un punto de conexi\u00f3n indicado por el entorno de AWS, como AWS_ENDPOINT_URL), y el estilo de alojamiento virtual en AWS. Establezca este par\u00e1metro para anular esa elecci\u00f3n.
storage.s3.requester-pays.tooltip=Cuando est\u00e1 habilitado, cada solicitud a S3 agrega el encabezado x-amz-request-payer: requester para que los costos de salida de datos y por operaci\u00f3n se facturen al solicitante (en lugar de al propietario del bucket).\n\nEs necesario para acceder a los buckets configurados con el modelo de facturaci\u00f3n Requester Pays. Sin el encabezado, esos buckets responden con 403 Forbidden. Algunos ejemplos son varios conjuntos de datos de AWS Open Data y de NOAA (p. ej., s3://noaa-nexrad-level2/).\n\nLa autenticaci\u00f3n es obligatoria: AWS rechaza las solicitudes an\u00f3nimas (sin firmar) a los buckets Requester Pays, ya que la identidad firmante es la que AWS usa para determinar la cuenta facturada. Combine esta opci\u00f3n con credenciales reales (cadena de credenciales predeterminada, perfil con nombre o clave de acceso y clave secreta est\u00e1ticas) y no la combine con storage.s3.anonymous=true.\n\nLa opci\u00f3n no tiene efecto en los buckets normales; el encabezado se ignora silenciosamente.
storage.s3.endpoint.tooltip=Reemplaza el punto de conexi\u00f3n del servicio S3 para que un URI can\u00f3nico s3://bucket/key apunte a un servicio compatible con S3 que no es de AWS (p. ej., http://localhost:9000 para MinIO, https://<account>.r2.cloudflarestorage.com para Cloudflare R2, https://<region>.digitaloceanspaces.com para DigitalOcean Spaces).\n\nEl valor es la ra\u00edz del servicio (esquema, host y puerto opcional) sin bucket ni clave, por ejemplo http://localhost:9000.\n\nCuando se establece, tiene prioridad sobre cualquier punto de conexi\u00f3n inferido a partir de un URI base http(s)://host/bucket/key. Sin ninguno de los dos, el almac\u00e9n usa el punto de conexi\u00f3n indicado por el entorno de AWS: la propiedad del sistema 'aws.endpointUrlS3' o 'aws.endpointUrl', la variable de entorno 'AWS_ENDPOINT_URL_S3' o 'AWS_ENDPOINT_URL' y, por \u00faltimo, 'endpoint_url' en los archivos de perfil de AWS. Sin ninguno de ellos, el almac\u00e9n usa los puntos de conexi\u00f3n predeterminados de AWS para su regi\u00f3n.\n\nDado que los puntos de conexi\u00f3n personalizados casi siempre requieren el direccionamiento de estilo de ruta, con un punto de conexi\u00f3n personalizado de cualquiera de estas fuentes el valor predeterminado de storage.s3.force-path-style pasa a ser true. Establezca storage.s3.force-path-style expl\u00edcitamente para anularlo.
storage.s3.region.tooltip=La regi\u00f3n de AWS del bucket, por ejemplo us-west-2.\n\nSi no se especifica, un almac\u00e9n en AWS toma la regi\u00f3n de la primera de estas fuentes:\n\n* la URL, cuando su host o el nombre del bucket contienen una regi\u00f3n;\n* la propiedad del sistema 'aws.region' y, luego, la variable de entorno 'AWS_REGION';\n* los archivos de perfil de AWS: el perfil de credenciales del almac\u00e9n o, si no lo hay, el perfil indicado por 'AWS_PROFILE' o 'default';\n* el servicio de metadatos de EC2, para un almac\u00e9n que usa la cadena de credenciales predeterminada de AWS;\n* us-east-1.\n\nUna solicitud que llega a la regi\u00f3n equivocada se reenv\u00eda a la regi\u00f3n del bucket. Las URL prefirmadas no se corrigen: necesitan la regi\u00f3n correcta.\n\nUn almac\u00e9n con un punto de conexi\u00f3n de servicio (consulte storage.s3.endpoint) ignora la regi\u00f3n del entorno: su regi\u00f3n solo sirve para firmar las solicitudes y es us-east-1, salvo que la URL o este par\u00e1metro indiquen otra. Cloudflare R2 espera 'auto'.
storage.s3.anonymous.tooltip=Cuando es true, el cliente del SDK de S3 se crea con AnonymousCredentialsProvider, por lo que las solicitudes no se firman. \u00daselo con buckets p\u00fablicos que permiten lecturas an\u00f3nimas (p. ej., Overture Maps, AWS Open Data). Tiene prioridad sobre la clave de acceso y la clave secreta, el perfil y la cadena de credenciales predeterminada.
storage.s3.aws-access-key-id.tooltip=El ID de clave de acceso de AWS que se usa para firmar las solicitudes, junto con la clave de acceso secreta; una clave sin la otra se ignora. El acceso an\u00f3nimo tiene prioridad sobre las claves.\n\nSin las claves, las solicitudes usan el perfil de credenciales cuando se indica uno y, en caso contrario, la cadena de proveedores de credenciales predeterminada de AWS.
storage.s3.aws-secret-access-key.tooltip=La clave de acceso secreta de AWS que se usa para firmar las solicitudes, junto con el ID de clave de acceso; una clave sin la otra se ignora. El acceso an\u00f3nimo tiene prioridad sobre las claves.\n\nSin las claves, las solicitudes usan el perfil de credenciales cuando se indica uno y, en caso contrario, la cadena de proveedores de credenciales predeterminada de AWS.
storage.s3.default-credentials-profile.tooltip=El nombre de un perfil del archivo de credenciales de AWS (normalmente ~/.aws/credentials) o del archivo de configuraci\u00f3n de AWS (normalmente ~/.aws/config). Las solicitudes usan solo ese perfil, independientemente de lo que establezca el entorno. El acceso an\u00f3nimo y las claves de acceso tienen prioridad sobre \u00e9l.\n\nSin un perfil, sin las claves de acceso y sin acceso an\u00f3nimo, la cadena de proveedores de credenciales predeterminada de AWS resuelve las credenciales: propiedades del sistema, variables de entorno, un token de identidad web, el perfil indicado por AWS_PROFILE (o 'default'), credenciales de contenedor y, por \u00faltimo, el perfil de instancia de EC2.
storage.gcs.project-id.tooltip=El ID de proyecto es un identificador \u00fanico, definido por el usuario, de un proyecto de Google Cloud.\n\nSi no se establece ning\u00fan ID de proyecto, se intenta obtener del entorno un ID de proyecto predeterminado.\n\nEl ID de proyecto predeterminado se obtiene del primer ID de proyecto disponible entre las siguientes fuentes:\n1. El ID de proyecto especificado por la variable de entorno GOOGLE_CLOUD_PROJECT\n2. El ID de proyecto de App Engine\n3. El ID de proyecto especificado en el archivo de credenciales JSON al que apunta la variable de entorno GOOGLE_APPLICATION_CREDENTIALS\n4. El ID de proyecto de Google Cloud SDK\n5. El ID de proyecto de Compute Engine
storage.gcs.quota-project-id.tooltip=El proyecto al que se imputan la cuota y la facturaci\u00f3n de las llamadas a la API, por ejemplo al autenticarse con credenciales de usuario mediante las credenciales predeterminadas de la aplicaci\u00f3n. Reemplaza el quota_project_id del archivo de credenciales.\n\nEl autor de la llamada debe tener el permiso serviceusage.services.use en el proyecto. En cambio, los buckets Requester Pays facturan al proyecto del par\u00e1metro de proyecto de usuario.
storage.gcs.anonymous.tooltip=Cuando es true, las solicitudes no se firman: no se buscan ni se env\u00edan credenciales. \u00daselo con buckets p\u00fablicos que permiten lecturas an\u00f3nimas y con emuladores como fake-gcs-server. Tiene prioridad sobre las credenciales predeterminadas de la aplicaci\u00f3n.\n\nCuando es false, las credenciales predeterminadas de la aplicaci\u00f3n autentican las solicitudes; la apertura de un Storage falla cuando no se encuentra ninguna. Para configurarlas, consulte https://cloud.google.com/docs/authentication/external/set-up-adc
storage.gcs.user-project.tooltip=ID del proyecto al que se facturan las operaciones sobre un bucket Requester Pays. Cuando se establece, el valor se adjunta a cada solicitud como la opci\u00f3n userProject (par\u00e1metro de URL); los buckets en modo Requester Pays rechazan con 400 UserProjectMissing las solicitudes que no lo incluyen.\n\nLa autenticaci\u00f3n es obligatoria: el solicitante debe ser una entidad principal autenticada (cuenta de servicio o usuario final) que tenga el permiso serviceusage.services.use en el proyecto de facturaci\u00f3n indicado. Las solicitudes an\u00f3nimas no pueden cumplir ese requisito: deje storage.gcs.anonymous deshabilitado para autenticarse con las credenciales predeterminadas de la aplicaci\u00f3n.
storage.gcs.endpoint.tooltip=Punto de conexi\u00f3n personalizado para servidores compatibles con GCS (p. ej., fake-gcs-server: http://localhost:4443). Cuando se establece, el SDK se dirige a este punto de conexi\u00f3n en lugar del punto de conexi\u00f3n p\u00fablico de Google. El valor es una URL completa del punto de conexi\u00f3n, con esquema, no un simple nombre de host. Las credenciales se rigen por storage.gcs.anonymous, igual que con el punto de conexi\u00f3n predeterminado: los emuladores necesitan que est\u00e9 habilitado.
storage.azure.blob-name.tooltip=Establece la ruta del blob (p. ej., /path/to/file.pmtiles).\n\nSi la URL del punto de conexi\u00f3n apunta a un blob del contenedor ra\u00edz, el an\u00e1lisis falla porque interpreta el nombre del blob como el nombre del contenedor. Con un solo elemento de ruta, es imposible distinguir entre un nombre de contenedor y un blob del contenedor ra\u00edz, por lo que se asume que es el nombre del contenedor, ya que es mucho m\u00e1s habitual\n\nAl trabajar con blobs del contenedor ra\u00edz, lo mejor es establecer el punto de conexi\u00f3n en la URL de la cuenta y especificar el nombre del blob por separado mediante este par\u00e1metro.
storage.azure.anonymous.tooltip=Cuando es true, el cliente del SDK de Azure se crea sin ninguna credencial. \u00daselo con contenedores p\u00fablicos configurados con acceso an\u00f3nimo de nivel Contenedor o Blob. Tiene prioridad sobre connection-string, account-key, sas-token y la cadena de credenciales predeterminada.
storage.azure.account-key.tooltip=La clave de acceso de la cuenta que se usa para autenticar la solicitud.\n\nCuando se especifica, el nombre de la cuenta obtenido del URI se usa con esta clave de acceso para crear una directiva de credenciales SharedKey que se incluye en un encabezado para autorizar las solicitudes
storage.azure.sas-token.tooltip=Firma de acceso compartido (SAS), un token de seguridad generado en el lado del cliente para conceder acceso limitado y delegado a los recursos de Azure.\n\nEste token tambi\u00e9n puede estar en la cadena de consulta de la URL del blob.
storage.azure.connection-string.tooltip=Cadena de conexi\u00f3n completa (DefaultEndpointsProtocol=...;AccountName=...;AccountKey=...;EndpointSuffix=...). Cuando se establece, tiene prioridad sobre account-key, sas-token y la cadena de credenciales predeterminada. Habitual con Azurite y en el desarrollo local.
storage.azure.endpoint.tooltip=Reemplaza la URL del punto de conexi\u00f3n del servicio Blob para que un URI en forma abreviada az://account/container apunte a un emulador, a una nube soberana o a un dominio personalizado en lugar de al punto de conexi\u00f3n p\u00fablico https://<account>.blob.core.windows.net.\n\nEl valor es el punto de conexi\u00f3n completo del servicio Blob, incluida la cuenta cuando el servicio la espera en la ruta. Para el emulador Azurite es http://127.0.0.1:10000/devstoreaccount1; para Azure Government es https://<account>.blob.core.usgovcloudapi.net.\n\nCuando se establece, reemplaza al punto de conexi\u00f3n derivado del URI. Dado que las formas de URI https:// y abfs(s):// ya codifican el punto de conexi\u00f3n en su host, este par\u00e1metro resulta \u00fatil sobre todo para la forma abreviada az://. D\u00e9jelo sin establecer para usar el punto de conexi\u00f3n p\u00fablico de Azure de la cuenta.
storage.azure.max-retries.tooltip=N\u00famero m\u00e1ximo de reintentos para las solicitudes fallidas del SDK de Azure. Valor predeterminado: 3.
storage.azure.retry-delay.tooltip=Retraso inicial antes del primer reintento; se duplica en cada reintento posterior hasta max-retry-delay. Duraci\u00f3n ISO-8601. Valor predeterminado: PT4S.
storage.azure.max-retry-delay.tooltip=L\u00edmite superior del retraso de retroceso de los reintentos. Duraci\u00f3n ISO-8601. Valor predeterminado: PT2M (120s).
storage.azure.try-timeout.tooltip=Tiempo de espera de cada intento individual de solicitud. Duraci\u00f3n ISO-8601. Valor predeterminado: PT60S.
storage.file.idle-timeout.tooltip=Tiempo de inactividad tras el cual un FileRangeReader cierra su FileChannel subyacente para liberar descriptores de archivo. El canal se vuelve a abrir bajo demanda en la siguiente lectura. Formato de duraci\u00f3n ISO-8601 (p. ej., PT60S para 60 segundos, PT0S para deshabilitarlo). Un valor superior a cero debe ser de al menos 1 milisegundo.
