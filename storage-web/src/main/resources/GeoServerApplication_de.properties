StorageUriValidator.invalidUri=Speicherort nicht erkannt. Verwenden Sie einen lokalen Pfad, einen file:-URI, eine http(s):-URL oder einen URI, dessen Schema von einem Speicheranbieter unterst\u00fctzt wird (z. B. s3:, gs:, azure:).

# Tooltips of the storage parameters. The English ones are the descriptions declared by tileverse-storage.
storage.caching.enabled.tooltip=Aktiviert das Caching roher Bytebereiche im Arbeitsspeicher. Ein zwischengespeicherter Bereich wird ohne Zugriff auf die Quelle erneut ausgeliefert, und gleichzeitige Anfragen nach demselben Bereich \u00fcber denselben Reader teilen sich einen einzigen Abruf. Standardm\u00e4\u00dfig deaktiviert.
storage.http.timeout-millis.tooltip=Gibt die maximale Wartezeit beim Herstellen einer Verbindung zum HTTP-Server an.\nDer Standardwert betr\u00e4gt 5000 Millisekunden (5 Sekunden). Bei langsamen oder unzuverl\u00e4ssigen Netzwerken sollte dieser Wert erh\u00f6ht werden.
storage.http.trust-all-certificates.tooltip=Der Wert true deaktiviert die Validierung von SSL/TLS-Zertifikaten und erlaubt damit Verbindungen zu Servern\nmit selbstsignierten oder ung\u00fcltigen Zertifikaten. Dies sollte NUR in Entwicklungs- und Testumgebungen\nverwendet werden. Der Standardwert ist false (Zertifikatsvalidierung aktiviert).
storage.http.username.tooltip=Benutzername f\u00fcr die HTTP-Basic-Authentifizierung. Muss zusammen mit dem Parameter f\u00fcr das Kennwort der HTTP-Basic-Authentifizierung verwendet werden.
storage.http.password.tooltip=Kennwort f\u00fcr die HTTP-Basic-Authentifizierung. Muss zusammen mit dem Parameter f\u00fcr den Benutzernamen der HTTP-Basic-Authentifizierung verwendet werden.
storage.http.bearer-token.tooltip=Bearer-Token f\u00fcr die Authentifizierung mit OAuth 2.0 oder JWT. Das Token wird mit jeder Anfrage im Header-Format "Authorization: Bearer <token>" gesendet.\n\n\u00dcblich bei modernen REST-APIs und Cloud-Diensten.
storage.http.api-key-headername.tooltip=Der Name des HTTP-Headers f\u00fcr die Authentifizierung per API-Schl\u00fcssel (z. B. "X-API-Key", "Authorization", "api-key"). Muss zusammen mit dem Parameter api-key verwendet werden.\n\n\u00dcblich bei REST-APIs mit benutzerdefinierter, Header-basierter Authentifizierung.
storage.http.api-key.tooltip=Der Wert des API-Schl\u00fcssels, der im benutzerdefinierten Header gesendet wird. Muss zusammen mit dem Parameter api-key-headername verwendet werden. Kann optional ein Pr\u00e4fix enthalten, das \u00fcber den Parameter "Pr\u00e4fix des API-Schl\u00fcsselwerts" festgelegt wird (z. B. "ApiKey " oder "Token ").
storage.http.api-key-value-prefix.tooltip=Optionales Pr\u00e4fix f\u00fcr den Wert des API-Schl\u00fcssels (z. B. "ApiKey ", "Token "). Falls angegeben, wird dieses Pr\u00e4fix dem API-Schl\u00fcssel vorangestellt, bevor er im Header gesendet wird.\n\nBeispiel: Das Pr\u00e4fix "ApiKey " mit dem Schl\u00fcssel "abc123" ergibt den Header-Wert "ApiKey abc123".
storage.s3.force-path-style.tooltip=Ist die Option aktiviert, verwenden Anfragen die Adressierung im Pfadstil (z. B. https://s3.amazonaws.com/bucket/key).\n\nIst sie deaktiviert, wird stattdessen die Adressierung im Virtual-Hosted-Stil verwendet (z. B. https://bucket.s3.amazonaws.com/key).\n\nDies kann f\u00fcr die Kompatibilit\u00e4t mit S3-kompatiblen Speichersystemen n\u00fctzlich sein, die keine Anfragen im Virtual-Hosted-Stil unterst\u00fctzen.\n\nOhne Wert wird der Pfadstil verwendet, wenn ein benutzerdefinierter Endpunkt gilt (storage.s3.endpoint, der Host einer http(s)-URL eines S3-kompatiblen Dienstes wie MinIO oder ein von der AWS-Umgebung benannter Endpunkt wie AWS_ENDPOINT_URL), auf AWS dagegen der Virtual-Hosted-Stil. Mit diesem Parameter l\u00e4sst sich diese Wahl \u00fcbersteuern.
storage.s3.requester-pays.tooltip=Ist die Option aktiviert, wird jeder S3-Anfrage der Header x-amz-request-payer: requester hinzugef\u00fcgt, damit dem Anforderer (anstelle des Bucket-Eigent\u00fcmers) die Kosten f\u00fcr ausgehenden Datenverkehr und die Kosten pro Vorgang in Rechnung gestellt werden.\n\nErforderlich f\u00fcr den Zugriff auf Buckets, die mit dem Abrechnungsmodell Requester Pays konfiguriert sind. Ohne den Header antworten solche Buckets mit 403 Forbidden. Beispiele sind mehrere Datens\u00e4tze von AWS Open Data und NOAA (z. B. s3://noaa-nexrad-level2/).\n\nDie Authentifizierung ist zwingend erforderlich: AWS lehnt anonyme (unsignierte) Anfragen an Buckets mit Requester Pays ab, da AWS das abzurechnende Konto anhand der signierten Identit\u00e4t bestimmt. Die Option ist mit echten Anmeldeinformationen zu kombinieren (Standardkette f\u00fcr Anmeldeinformationen, benanntes Profil oder statischer Zugriffsschl\u00fcssel mit geheimem Schl\u00fcssel), nicht mit storage.s3.anonymous=true.\n\nBei regul\u00e4ren Buckets hat die Option keine Wirkung; der Header wird stillschweigend ignoriert.
storage.s3.endpoint.tooltip=\u00dcberschreibt den S3-Dienstendpunkt, damit ein kanonischer URI der Form s3://bucket/key auf einen S3-kompatiblen Dienst au\u00dferhalb von AWS verweisen kann (z. B. http://localhost:9000 f\u00fcr MinIO, https://<account>.r2.cloudflarestorage.com f\u00fcr Cloudflare R2, https://<region>.digitaloceanspaces.com f\u00fcr DigitalOcean Spaces).\n\nDer Wert ist die Stammadresse des Dienstes (Schema, Host und optionaler Port) ohne Bucket oder Schl\u00fcssel, zum Beispiel http://localhost:9000.\n\nIst der Parameter gesetzt, hat er Vorrang vor jedem Endpunkt, der aus einem Basis-URI der Form http(s)://host/bucket/key abgeleitet wird. Fehlen beide, verwendet der Datenspeicher den von der AWS-Umgebung benannten Endpunkt: die Systemeigenschaft 'aws.endpointUrlS3' oder 'aws.endpointUrl', die Umgebungsvariable 'AWS_ENDPOINT_URL_S3' oder 'AWS_ENDPOINT_URL', danach 'endpoint_url' in den AWS-Profildateien. Fehlen auch diese, verwendet der Datenspeicher die AWS-Standardendpunkte seiner Region.\n\nDa benutzerdefinierte Endpunkte fast immer die Adressierung im Pfadstil erfordern, setzt ein benutzerdefinierter Endpunkt aus einer dieser Quellen storage.s3.force-path-style standardm\u00e4\u00dfig auf true. Zum \u00dcbersteuern ist storage.s3.force-path-style ausdr\u00fccklich zu setzen.
storage.s3.region.tooltip=Die AWS-Region des Buckets, zum Beispiel us-west-2.\n\nOhne Angabe \u00fcbernimmt ein Datenspeicher auf AWS die Region aus der ersten dieser Quellen:\n\n* der URL, wenn ihr Host oder der Bucket-Name eine Region enth\u00e4lt;\n* der Systemeigenschaft 'aws.region', danach der Umgebungsvariablen 'AWS_REGION';\n* den AWS-Profildateien: dem Anmeldeinformationsprofil des Datenspeichers, sonst dem von 'AWS_PROFILE' benannten Profil oder 'default';\n* dem EC2-Metadatendienst, f\u00fcr einen Datenspeicher mit der Standardkette f\u00fcr Anmeldeinformationen von AWS;\n* us-east-1.\n\nEine Anfrage, die die falsche Region erreicht, wird erneut an die Region des Buckets gesendet. Vorsignierte URLs werden nicht korrigiert: Sie ben\u00f6tigen die richtige Region.\n\nEin Datenspeicher mit einem Dienstendpunkt (siehe storage.s3.endpoint) ignoriert die Region der Umgebung: Seine Region dient nur zum Signieren der Anfragen und ist us-east-1, sofern weder die URL noch dieser Parameter eine Region nennt. Cloudflare R2 erwartet 'auto'.
storage.s3.anonymous.tooltip=Bei true wird der S3-SDK-Client mit dem AnonymousCredentialsProvider erstellt, sodass Anfragen unsigniert sind. Zu verwenden f\u00fcr \u00f6ffentliche Buckets, die anonyme Lesezugriffe erlauben (z. B. Overture Maps, AWS Open Data). Hat Vorrang vor Zugriffsschl\u00fcssel/geheimem Schl\u00fcssel, Profil und der Standardkette f\u00fcr Anmeldeinformationen.
storage.s3.aws-access-key-id.tooltip=Die AWS-Zugriffsschl\u00fcssel-ID, mit der Anfragen zusammen mit dem geheimen Zugriffsschl\u00fcssel signiert werden; ein einzelner Schl\u00fcssel allein wird ignoriert. Der anonyme Zugriff hat Vorrang vor den Schl\u00fcsseln.\n\nOhne die Schl\u00fcssel verwenden Anfragen das Anmeldeinformationsprofil, sofern eines angegeben ist, andernfalls die AWS-Standardanbieterkette f\u00fcr Anmeldeinformationen.
storage.s3.aws-secret-access-key.tooltip=Der geheime AWS-Zugriffsschl\u00fcssel, mit dem Anfragen zusammen mit der Zugriffsschl\u00fcssel-ID signiert werden; ein einzelner Schl\u00fcssel allein wird ignoriert. Der anonyme Zugriff hat Vorrang vor den Schl\u00fcsseln.\n\nOhne die Schl\u00fcssel verwenden Anfragen das Anmeldeinformationsprofil, sofern eines angegeben ist, andernfalls die AWS-Standardanbieterkette f\u00fcr Anmeldeinformationen.
storage.s3.default-credentials-profile.tooltip=Der Name eines Profils in der AWS-Datei mit Anmeldeinformationen (\u00fcblicherweise ~/.aws/credentials) oder in der AWS-Konfigurationsdatei (\u00fcblicherweise ~/.aws/config). Anfragen verwenden ausschlie\u00dflich dieses Profil, unabh\u00e4ngig von den Einstellungen der Umgebung. Der anonyme Zugriff und die Zugriffsschl\u00fcssel haben Vorrang vor dem Profil.\n\nOhne Profil, Zugriffsschl\u00fcssel oder anonymen Zugriff ermittelt die AWS-Standardanbieterkette f\u00fcr Anmeldeinformationen die Anmeldeinformationen: Systemeigenschaften, Umgebungsvariablen, ein Web-Identit\u00e4tstoken, das durch AWS_PROFILE benannte Profil (oder 'default'), Container-Anmeldeinformationen, zuletzt das EC2-Instance-Profil.
storage.gcs.project-id.tooltip=Die Projekt-ID ist eine eindeutige, benutzerdefinierte Kennung eines Google Cloud-Projekts.\n\nIst keine Projekt-ID gesetzt, wird versucht, eine Standard-Projekt-ID aus der Umgebung zu ermitteln.\n\nAls Standard-Projekt-ID gilt die erste verf\u00fcgbare Projekt-ID aus folgenden Quellen:\n1. Die in der Umgebungsvariablen GOOGLE_CLOUD_PROJECT angegebene Projekt-ID\n2. Die Projekt-ID von App Engine\n3. Die Projekt-ID aus der JSON-Datei mit Anmeldeinformationen, auf die die Umgebungsvariable GOOGLE_APPLICATION_CREDENTIALS verweist\n4. Die Projekt-ID des Google Cloud SDK\n5. Die Projekt-ID von Compute Engine
storage.gcs.quota-project-id.tooltip=Das Projekt, dem Kontingent und Abrechnung der API-Aufrufe zugerechnet werden, zum Beispiel bei der Authentifizierung mit Benutzeranmeldeinformationen \u00fcber Application Default Credentials. Es \u00fcberschreibt die quota_project_id der Datei mit Anmeldeinformationen.\n\nDer Aufrufer ben\u00f6tigt f\u00fcr das Projekt die Berechtigung serviceusage.services.use. Bei Buckets mit Requester Pays wird stattdessen das Projekt aus dem Parameter f\u00fcr das Benutzerprojekt belastet.
storage.gcs.anonymous.tooltip=Bei true sind Anfragen unsigniert: Es werden keine Anmeldeinformationen gesucht oder gesendet. Zu verwenden f\u00fcr \u00f6ffentliche Buckets, die anonyme Lesezugriffe erlauben, und f\u00fcr Emulatoren wie fake-gcs-server. Hat Vorrang vor Application Default Credentials.\n\nBei false authentifizieren Application Default Credentials die Anfragen; das \u00d6ffnen eines Storage schl\u00e4gt fehl, wenn keine gefunden werden. Zur Einrichtung siehe https://cloud.google.com/docs/authentication/external/set-up-adc
storage.gcs.user-project.tooltip=Projekt-ID, \u00fcber die Vorg\u00e4nge an einem Bucket mit Requester Pays abgerechnet werden. Ist der Parameter gesetzt, wird der Wert jeder Anfrage als Option userProject (URL-Parameter) angeh\u00e4ngt; Buckets im Modus Requester Pays lehnen Anfragen ohne diese Option mit 400 UserProjectMissing ab.\n\nDie Authentifizierung ist zwingend erforderlich: Der Anforderer muss ein authentifiziertes Hauptkonto (Dienstkonto oder Endbenutzer) sein, das f\u00fcr das angegebene Abrechnungsprojekt die Berechtigung serviceusage.services.use besitzt. Anonyme Anfragen k\u00f6nnen diese Voraussetzung nicht erf\u00fcllen: storage.gcs.anonymous muss deaktiviert bleiben, damit die Authentifizierung mit Application Default Credentials erfolgt.
storage.gcs.endpoint.tooltip=Benutzerdefinierter Endpunkt f\u00fcr GCS-kompatible Server (z. B. fake-gcs-server: http://localhost:4443). Ist der Parameter gesetzt, verwendet das SDK diesen Endpunkt anstelle des \u00f6ffentlichen Google-Endpunkts. Der Wert ist eine vollst\u00e4ndige Endpunkt-URL mit Schema, kein blo\u00dfer Hostname. Die Anmeldeinformationen richten sich wie beim Standardendpunkt nach storage.gcs.anonymous: F\u00fcr Emulatoren muss storage.gcs.anonymous gesetzt sein.
storage.azure.blob-name.tooltip=Legt den Blobpfad fest (z. B. /path/to/file.pmtiles).\n\nVerweist die Endpunkt-URL auf ein Blob im Stammcontainer, schl\u00e4gt das Parsen fehl, weil der Blobname als Containername interpretiert wird. Bei nur einem Pfadelement l\u00e4sst sich nicht zwischen einem Containernamen und einem Blob im Stammcontainer unterscheiden; daher wird der Containername angenommen, da dies der weitaus h\u00e4ufigere Fall ist.\n\nBei der Arbeit mit Blobs im Stammcontainer empfiehlt es sich, den Endpunkt auf die Konto-URL zu setzen und den Blobnamen separat \u00fcber diesen Parameter anzugeben.
storage.azure.anonymous.tooltip=Bei true wird der Azure-SDK-Client ohne Anmeldeinformationen erstellt. Zu verwenden f\u00fcr \u00f6ffentliche Container, die mit anonymem Zugriff auf Container- oder Blobebene konfiguriert sind. Hat Vorrang vor connection-string, account-key, sas-token und der Standardkette f\u00fcr Anmeldeinformationen.
storage.azure.account-key.tooltip=Der Kontozugriffsschl\u00fcssel, mit dem die Anfrage authentifiziert wird.\n\nFalls angegeben, wird der aus dem URI ermittelte Kontoname zusammen mit diesem Zugriffsschl\u00fcssel verwendet, um eine SharedKey-Richtlinie f\u00fcr Anmeldeinformationen zu erstellen, die zur Autorisierung von Anfragen in einen Header eingef\u00fcgt wird.
storage.azure.sas-token.tooltip=Shared Access Signature, ein clientseitig erzeugtes Sicherheitstoken, das eingeschr\u00e4nkten, delegierten Zugriff auf Azure-Ressourcen gew\u00e4hrt.\n\nDieses Token kann auch in der Abfragezeichenfolge der Blob-URL enthalten sein.
storage.azure.connection-string.tooltip=Vollst\u00e4ndige Verbindungszeichenfolge (DefaultEndpointsProtocol=...;AccountName=...;AccountKey=...;EndpointSuffix=...). Ist sie gesetzt, hat sie Vorrang vor account-key, sas-token und der Standardkette f\u00fcr Anmeldeinformationen. \u00dcblich f\u00fcr Azurite und die lokale Entwicklung.
storage.azure.endpoint.tooltip=\u00dcberschreibt die URL des Blob-Dienstendpunkts, damit ein URI in der Kurzform az://account/container auf einen Emulator, eine souver\u00e4ne Cloud oder eine benutzerdefinierte Dom\u00e4ne statt auf den \u00f6ffentlichen Endpunkt https://<account>.blob.core.windows.net verweisen kann.\n\nDer Wert ist der vollst\u00e4ndige Blob-Dienstendpunkt, einschlie\u00dflich des Kontos, sofern der Dienst es im Pfad erwartet. F\u00fcr den Emulator Azurite lautet er http://127.0.0.1:10000/devstoreaccount1; f\u00fcr Azure Government lautet er https://<account>.blob.core.usgovcloudapi.net.\n\nIst der Parameter gesetzt, ersetzt er den aus dem URI abgeleiteten Endpunkt. Da die URI-Formen https:// und abfs(s):// den Endpunkt bereits in ihrem Host enthalten, ist dieser Parameter vor allem f\u00fcr die Kurzform az:// n\u00fctzlich. Ohne Angabe wird der \u00f6ffentliche Azure-Endpunkt des Kontos verwendet.
storage.azure.max-retries.tooltip=Maximale Anzahl von Wiederholungsversuchen f\u00fcr fehlgeschlagene Anfragen des Azure SDK. Standardwert: 3.
storage.azure.retry-delay.tooltip=Anf\u00e4ngliche Verz\u00f6gerung vor dem ersten Wiederholungsversuch; verdoppelt sich bei jedem weiteren Wiederholungsversuch bis zu max-retry-delay. ISO-8601-Dauer. Standardwert: PT4S.
storage.azure.max-retry-delay.tooltip=Obergrenze f\u00fcr die Backoff-Verz\u00f6gerung der Wiederholungsversuche. ISO-8601-Dauer. Standardwert: PT2M (120s).
storage.azure.try-timeout.tooltip=Timeout f\u00fcr jeden einzelnen Anfrageversuch. ISO-8601-Dauer. Standardwert: PT60S.
storage.file.idle-timeout.tooltip=Leerlauf-Timeout, nach dem ein FileRangeReader seinen zugrunde liegenden FileChannel schlie\u00dft, um Dateideskriptoren freizugeben. Der Kanal wird beim n\u00e4chsten Lesezugriff bei Bedarf erneut ge\u00f6ffnet. Format: ISO-8601-Dauer (z. B. PT60S f\u00fcr 60 Sekunden, PT0S zum Deaktivieren). Ein Wert \u00fcber null muss mindestens 1 Millisekunde betragen.
