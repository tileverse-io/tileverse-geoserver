# Tooltips of the storage parameters. The English ones are the descriptions declared by tileverse-storage.
storage.caching.enabled.tooltip=Active la mise en cache en m\u00e9moire des plages d'octets bruts. Une plage mise en cache est resservie sans solliciter la source, et les requ\u00eates simultan\u00e9es portant sur la m\u00eame plage via un m\u00eame lecteur partagent une seule r\u00e9cup\u00e9ration. D\u00e9sactiv\u00e9e par d\u00e9faut.
storage.http.timeout-millis.tooltip=Indique le temps d'attente maximal lors de l'\u00e9tablissement d'une connexion au serveur HTTP.\nLa valeur par d\u00e9faut est de 5000 millisecondes (5 secondes). Augmenter cette valeur pour les r\u00e9seaux lents ou peu fiables.
storage.http.trust-all-certificates.tooltip=Lorsque la valeur est true, d\u00e9sactive la validation des certificats SSL/TLS, ce qui autorise les connexions aux serveurs\ndont les certificats sont auto-sign\u00e9s ou invalides. Ce param\u00e8tre doit \u00eatre utilis\u00e9 UNIQUEMENT dans les environnements\nde d\u00e9veloppement ou de test. La valeur par d\u00e9faut est false (validation des certificats activ\u00e9e).
storage.http.username.tooltip=Nom d'utilisateur pour l'authentification HTTP Basic. Doit \u00eatre utilis\u00e9 conjointement avec le param\u00e8tre de mot de passe de l'authentification HTTP Basic.
storage.http.password.tooltip=Mot de passe pour l'authentification HTTP Basic. Doit \u00eatre utilis\u00e9 conjointement avec le param\u00e8tre de nom d'utilisateur de l'authentification HTTP Basic.
storage.http.bearer-token.tooltip=Jeton Bearer pour l'authentification OAuth 2.0 ou JWT. Le jeton est envoy\u00e9 avec chaque requ\u00eate au format d'en-t\u00eate "Authorization: Bearer <token>".\n\nCouramment utilis\u00e9 avec les API REST modernes et les services cloud.
storage.http.api-key-headername.tooltip=Nom de l'en-t\u00eate HTTP \u00e0 utiliser pour l'authentification par cl\u00e9 API (par exemple "X-API-Key", "Authorization", "api-key"). Doit \u00eatre utilis\u00e9 conjointement avec le param\u00e8tre api-key.\n\nCourant dans les API REST dont l'authentification repose sur un en-t\u00eate personnalis\u00e9.
storage.http.api-key.tooltip=Valeur de la cl\u00e9 API \u00e0 envoyer dans l'en-t\u00eate personnalis\u00e9. Doit \u00eatre utilis\u00e9e conjointement avec le param\u00e8tre api-key-headername. Peut \u00e9ventuellement inclure un pr\u00e9fixe indiqu\u00e9 par le param\u00e8tre "Pr\u00e9fixe de la valeur de cl\u00e9 API" (par exemple "ApiKey " ou "Token ").
storage.http.api-key-value-prefix.tooltip=Pr\u00e9fixe facultatif de la valeur de la cl\u00e9 API (par exemple "ApiKey ", "Token "). S'il est indiqu\u00e9, ce pr\u00e9fixe est ajout\u00e9 devant la cl\u00e9 API avant son envoi dans l'en-t\u00eate.\n\nExemple : le pr\u00e9fixe "ApiKey " avec la cl\u00e9 "abc123" donne la valeur d'en-t\u00eate "ApiKey abc123".
storage.s3.force-path-style.tooltip=Lorsque cette option est activ\u00e9e, les requ\u00eates utilisent l'adressage de type chemin (par exemple https://s3.amazonaws.com/bucket/key).\n\nLorsqu'elle est d\u00e9sactiv\u00e9e, l'adressage de type h\u00e9bergement virtuel est utilis\u00e9 \u00e0 la place (par exemple https://bucket.s3.amazonaws.com/key).\n\nCela peut \u00eatre utile pour la compatibilit\u00e9 avec les syst\u00e8mes de stockage compatibles S3 qui ne prennent pas en charge les requ\u00eates de type h\u00e9bergement virtuel.\n\nSans valeur, le type chemin est utilis\u00e9 lorsqu'un point de terminaison personnalis\u00e9 s'applique (storage.s3.endpoint, l'h\u00f4te d'une URL http(s) d'un service compatible S3 tel que MinIO, ou un point de terminaison d\u00e9sign\u00e9 par l'environnement AWS, par exemple AWS_ENDPOINT_URL), et le type h\u00e9bergement virtuel sur AWS. D\u00e9finir ce param\u00e8tre pour remplacer ce choix.
storage.s3.requester-pays.tooltip=Lorsque cette option est activ\u00e9e, chaque requ\u00eate S3 ajoute l'en-t\u00eate x-amz-request-payer: requester afin que les co\u00fbts de transfert de donn\u00e9es sortant et les co\u00fbts par op\u00e9ration soient factur\u00e9s au demandeur (et non au propri\u00e9taire du compartiment).\n\nN\u00e9cessaire pour acc\u00e9der aux compartiments configur\u00e9s avec le mod\u00e8le de facturation Requester Pays. Sans cet en-t\u00eate, ces compartiments r\u00e9pondent par 403 Forbidden. C'est le cas, entre autres, de plusieurs jeux de donn\u00e9es AWS Open Data et NOAA (par exemple s3://noaa-nexrad-level2/).\n\nL'authentification est obligatoire : AWS rejette les requ\u00eates anonymes (non sign\u00e9es) adress\u00e9es aux compartiments Requester Pays, car AWS s'appuie sur l'identit\u00e9 signataire pour d\u00e9terminer le compte factur\u00e9. Associer cette option \u00e0 de v\u00e9ritables informations d'identification (cha\u00eene d'informations d'identification par d\u00e9faut, profil nomm\u00e9, ou cl\u00e9 d'acc\u00e8s et cl\u00e9 secr\u00e8te statiques) et ne pas l'associer \u00e0 storage.s3.anonymous=true.\n\nL'option est sans effet sur les compartiments ordinaires ; l'en-t\u00eate est ignor\u00e9 silencieusement.
storage.s3.endpoint.tooltip=Remplace le point de terminaison du service S3 afin qu'un URI canonique s3://bucket/key cible un service compatible S3 autre qu'AWS (par exemple http://localhost:9000 pour MinIO, https://<account>.r2.cloudflarestorage.com pour Cloudflare R2, https://<region>.digitaloceanspaces.com pour DigitalOcean Spaces).\n\nLa valeur est la racine du service (sch\u00e9ma, h\u00f4te et port facultatif), sans compartiment ni cl\u00e9, par exemple http://localhost:9000.\n\nLorsque ce param\u00e8tre est d\u00e9fini, il pr\u00e9vaut sur tout point de terminaison d\u00e9duit d'un URI de base http(s)://host/bucket/key. \u00c0 d\u00e9faut des deux, l'entrep\u00f4t utilise le point de terminaison d\u00e9sign\u00e9 par l'environnement AWS : la propri\u00e9t\u00e9 syst\u00e8me 'aws.endpointUrlS3' ou 'aws.endpointUrl', la variable d'environnement 'AWS_ENDPOINT_URL_S3' ou 'AWS_ENDPOINT_URL', puis 'endpoint_url' dans les fichiers de profil AWS. Sans aucun d'eux, l'entrep\u00f4t utilise les points de terminaison AWS par d\u00e9faut de sa r\u00e9gion.\n\nComme les points de terminaison personnalis\u00e9s exigent presque toujours l'adressage de type chemin, un point de terminaison personnalis\u00e9 provenant de l'une de ces sources donne \u00e0 storage.s3.force-path-style la valeur par d\u00e9faut true. D\u00e9finir explicitement storage.s3.force-path-style pour modifier ce comportement.
storage.s3.region.tooltip=La r\u00e9gion AWS du compartiment, par exemple us-west-2.\n\nSi elle n'est pas indiqu\u00e9e, un entrep\u00f4t sur AWS prend la r\u00e9gion de la premi\u00e8re de ces sources :\n\n* l'URL, lorsque son h\u00f4te ou le nom du compartiment contient une r\u00e9gion ;\n* la propri\u00e9t\u00e9 syst\u00e8me 'aws.region', puis la variable d'environnement 'AWS_REGION' ;\n* les fichiers de profil AWS : le profil d'informations d'identification de l'entrep\u00f4t, sinon le profil d\u00e9sign\u00e9 par 'AWS_PROFILE' ou 'default' ;\n* le service de m\u00e9tadonn\u00e9es EC2, pour un entrep\u00f4t qui utilise la cha\u00eene d'informations d'identification par d\u00e9faut d'AWS ;\n* us-east-1.\n\nUne requ\u00eate qui atteint la mauvaise r\u00e9gion est renvoy\u00e9e vers la r\u00e9gion du compartiment. Les URL pr\u00e9sign\u00e9es ne sont pas corrig\u00e9es : elles exigent la bonne r\u00e9gion.\n\nUn entrep\u00f4t dot\u00e9 d'un point de terminaison de service (voir storage.s3.endpoint) ignore la r\u00e9gion de l'environnement : sa r\u00e9gion sert uniquement \u00e0 signer les requ\u00eates et vaut us-east-1, sauf si l'URL ou ce param\u00e8tre en indique une. Cloudflare R2 attend 'auto'.
storage.s3.anonymous.tooltip=Lorsque la valeur est true, le client du SDK S3 est construit avec l'AnonymousCredentialsProvider, de sorte que les requ\u00eates ne sont pas sign\u00e9es. \u00c0 utiliser pour les compartiments publics qui autorisent les lectures anonymes (par exemple Overture Maps, AWS Open Data). Pr\u00e9vaut sur la cl\u00e9 d'acc\u00e8s et la cl\u00e9 secr\u00e8te, le profil et la cha\u00eene d'informations d'identification par d\u00e9faut.
storage.s3.aws-access-key-id.tooltip=ID de cl\u00e9 d'acc\u00e8s AWS utilis\u00e9 pour signer les requ\u00eates, conjointement avec la cl\u00e9 d'acc\u00e8s secr\u00e8te ; une cl\u00e9 fournie sans l'autre est ignor\u00e9e. L'acc\u00e8s anonyme pr\u00e9vaut sur les cl\u00e9s.\n\nSans les cl\u00e9s, les requ\u00eates utilisent le profil d'informations d'identification lorsqu'un profil est nomm\u00e9, et sinon la cha\u00eene de fournisseurs d'informations d'identification par d\u00e9faut d'AWS.
storage.s3.aws-secret-access-key.tooltip=Cl\u00e9 d'acc\u00e8s secr\u00e8te AWS utilis\u00e9e pour signer les requ\u00eates, conjointement avec l'ID de cl\u00e9 d'acc\u00e8s ; une cl\u00e9 fournie sans l'autre est ignor\u00e9e. L'acc\u00e8s anonyme pr\u00e9vaut sur les cl\u00e9s.\n\nSans les cl\u00e9s, les requ\u00eates utilisent le profil d'informations d'identification lorsqu'un profil est nomm\u00e9, et sinon la cha\u00eene de fournisseurs d'informations d'identification par d\u00e9faut d'AWS.
storage.s3.default-credentials-profile.tooltip=Nom d'un profil du fichier d'informations d'identification AWS (g\u00e9n\u00e9ralement ~/.aws/credentials) ou du fichier de configuration AWS (g\u00e9n\u00e9ralement ~/.aws/config). Les requ\u00eates utilisent uniquement ce profil, quelles que soient les valeurs d\u00e9finies par l'environnement. L'acc\u00e8s anonyme et les cl\u00e9s d'acc\u00e8s pr\u00e9valent sur ce profil.\n\nSans profil, sans cl\u00e9s d'acc\u00e8s et sans acc\u00e8s anonyme, la cha\u00eene de fournisseurs d'informations d'identification par d\u00e9faut d'AWS r\u00e9sout les informations d'identification : propri\u00e9t\u00e9s syst\u00e8me, variables d'environnement, jeton d'identit\u00e9 web, profil d\u00e9sign\u00e9 par AWS_PROFILE (ou 'default'), informations d'identification du conteneur, puis profil d'instance EC2.
storage.gcs.project-id.tooltip=L'ID de projet est un identifiant unique, d\u00e9fini par l'utilisateur, d'un projet Google Cloud.\n\nSi aucun ID de projet n'est d\u00e9fini, une tentative d'obtention d'un ID de projet par d\u00e9faut \u00e0 partir de l'environnement est effectu\u00e9e.\n\nL'ID de projet par d\u00e9faut est le premier ID de projet disponible parmi les sources suivantes :\n1. L'ID de projet indiqu\u00e9 par la variable d'environnement GOOGLE_CLOUD_PROJECT\n2. L'ID de projet App Engine\n3. L'ID de projet indiqu\u00e9 dans le fichier JSON d'informations d'identification d\u00e9sign\u00e9 par la variable d'environnement GOOGLE_APPLICATION_CREDENTIALS\n4. L'ID de projet du Google Cloud SDK\n5. L'ID de projet Compute Engine
storage.gcs.quota-project-id.tooltip=Projet auquel sont imput\u00e9s le quota et la facturation des appels d'API, par exemple lors d'une authentification avec des informations d'identification d'utilisateur via les Application Default Credentials. Il remplace le quota_project_id du fichier d'informations d'identification.\n\nL'appelant doit disposer de l'autorisation serviceusage.services.use sur le projet. Les compartiments Requester Pays facturent \u00e0 la place le projet indiqu\u00e9 par le param\u00e8tre user project.
storage.gcs.anonymous.tooltip=Lorsque la valeur est true, les requ\u00eates ne sont pas sign\u00e9es : aucune information d'identification n'est recherch\u00e9e ni envoy\u00e9e. \u00c0 utiliser pour les compartiments publics qui autorisent les lectures anonymes, ainsi que pour les \u00e9mulateurs tels que fake-gcs-server. Pr\u00e9vaut sur les Application Default Credentials.\n\nLorsque la valeur est false, les Application Default Credentials authentifient les requ\u00eates ; l'ouverture d'un Storage \u00e9choue lorsqu'il est impossible d'en trouver. Pour les configurer, voir https://cloud.google.com/docs/authentication/external/set-up-adc
storage.gcs.user-project.tooltip=ID du projet \u00e0 facturer pour les op\u00e9rations sur un compartiment Requester Pays. Lorsqu'il est d\u00e9fini, la valeur est jointe \u00e0 chaque requ\u00eate sous la forme de l'option userProject (param\u00e8tre d'URL) ; les compartiments en mode Requester Pays rejettent les requ\u00eates qui en sont d\u00e9pourvues avec 400 UserProjectMissing.\n\nL'authentification est obligatoire : le demandeur doit \u00eatre un compte principal authentifi\u00e9 (compte de service ou utilisateur final) disposant de l'autorisation serviceusage.services.use sur le projet de facturation indiqu\u00e9. Les requ\u00eates anonymes ne peuvent pas satisfaire cette exigence : laisser storage.gcs.anonymous d\u00e9sactiv\u00e9 pour s'authentifier avec les Application Default Credentials.
storage.gcs.endpoint.tooltip=Point de terminaison personnalis\u00e9 pour les serveurs compatibles GCS (par exemple fake-gcs-server : http://localhost:4443). Lorsqu'il est d\u00e9fini, le SDK cible ce point de terminaison au lieu du point de terminaison public de Google. La valeur est une URL de point de terminaison compl\u00e8te avec son sch\u00e9ma, et non un simple nom d'h\u00f4te. Les informations d'identification suivent storage.gcs.anonymous comme pour le point de terminaison par d\u00e9faut : les \u00e9mulateurs exigent que ce param\u00e8tre soit activ\u00e9.
storage.azure.blob-name.tooltip=D\u00e9finit le chemin du blob (par exemple /path/to/file.pmtiles).\n\nSi l'URL du point de terminaison d\u00e9signe un blob du conteneur racine, l'analyse \u00e9choue car elle interpr\u00e8te le nom du blob comme le nom du conteneur. Avec un seul \u00e9l\u00e9ment de chemin, il est impossible de distinguer un nom de conteneur d'un blob du conteneur racine ; il est donc consid\u00e9r\u00e9 comme le nom du conteneur, ce cas \u00e9tant beaucoup plus courant\n\nPour travailler avec des blobs du conteneur racine, il est pr\u00e9f\u00e9rable de d\u00e9finir le point de terminaison sur l'URL du compte et d'indiquer le nom du blob s\u00e9par\u00e9ment \u00e0 l'aide de ce param\u00e8tre.
storage.azure.anonymous.tooltip=Lorsque la valeur est true, le client du SDK Azure est construit sans aucune information d'identification. \u00c0 utiliser pour les conteneurs publics configur\u00e9s avec un acc\u00e8s anonyme de niveau Conteneur ou Blob. Pr\u00e9vaut sur connection-string, account-key, sas-token et la cha\u00eene d'informations d'identification par d\u00e9faut.
storage.azure.account-key.tooltip=Cl\u00e9 d'acc\u00e8s du compte utilis\u00e9e pour authentifier la requ\u00eate.\n\nLorsqu'elle est indiqu\u00e9e, le nom de compte obtenu \u00e0 partir de l'URI est utilis\u00e9 avec cette cl\u00e9 d'acc\u00e8s pour cr\u00e9er une strat\u00e9gie d'informations d'identification SharedKey, plac\u00e9e dans un en-t\u00eate pour autoriser les requ\u00eates
storage.azure.sas-token.tooltip=Signature d'acc\u00e8s partag\u00e9 (Shared Access Signature), jeton de s\u00e9curit\u00e9 g\u00e9n\u00e9r\u00e9 c\u00f4t\u00e9 client pour accorder un acc\u00e8s limit\u00e9 et d\u00e9l\u00e9gu\u00e9 aux ressources Azure.\n\nCe jeton peut \u00e9galement figurer dans la cha\u00eene de requ\u00eate de l'URL du blob.
storage.azure.connection-string.tooltip=Cha\u00eene de connexion compl\u00e8te (DefaultEndpointsProtocol=...;AccountName=...;AccountKey=...;EndpointSuffix=...). Lorsqu'elle est d\u00e9finie, elle pr\u00e9vaut sur account-key, sas-token et la cha\u00eene d'informations d'identification par d\u00e9faut. Courante avec Azurite et en d\u00e9veloppement local.
storage.azure.endpoint.tooltip=Remplace l'URL du point de terminaison du service Blob afin qu'un URI de forme courte az://account/container cible un \u00e9mulateur, un cloud souverain ou un domaine personnalis\u00e9 au lieu du point de terminaison public https://<account>.blob.core.windows.net.\n\nLa valeur est le point de terminaison complet du service Blob, y compris le compte lorsque le service l'attend dans le chemin. Pour l'\u00e9mulateur Azurite, il s'agit de http://127.0.0.1:10000/devstoreaccount1 ; pour Azure Government, de https://<account>.blob.core.usgovcloudapi.net.\n\nLorsque ce param\u00e8tre est d\u00e9fini, il remplace le point de terminaison d\u00e9riv\u00e9 de l'URI. Comme les formes d'URI https:// et abfs(s):// encodent d\u00e9j\u00e0 le point de terminaison dans leur h\u00f4te, ce param\u00e8tre est surtout utile pour la forme courte az://. Laisser ce param\u00e8tre non d\u00e9fini pour utiliser le point de terminaison Azure public du compte.
storage.azure.max-retries.tooltip=Nombre maximal de nouvelles tentatives pour les requ\u00eates du SDK Azure ayant \u00e9chou\u00e9. Valeur par d\u00e9faut : 3.
storage.azure.retry-delay.tooltip=D\u00e9lai initial avant la premi\u00e8re nouvelle tentative ; il double \u00e0 chaque nouvelle tentative suivante, jusqu'\u00e0 max-retry-delay. Dur\u00e9e ISO-8601. Valeur par d\u00e9faut : PT4S.
storage.azure.max-retry-delay.tooltip=Borne sup\u00e9rieure du d\u00e9lai de temporisation avant nouvelle tentative. Dur\u00e9e ISO-8601. Valeur par d\u00e9faut : PT2M (120s).
storage.azure.try-timeout.tooltip=D\u00e9lai d'expiration de chaque tentative de requ\u00eate individuelle. Dur\u00e9e ISO-8601. Valeur par d\u00e9faut : PT60S.
storage.file.idle-timeout.tooltip=D\u00e9lai d'inactivit\u00e9 au terme duquel un FileRangeReader ferme son FileChannel sous-jacent pour lib\u00e9rer les descripteurs de fichiers. Le canal est rouvert \u00e0 la demande lors de la lecture suivante. Format de dur\u00e9e ISO-8601 (par exemple PT60S pour 60 secondes, PT0S pour d\u00e9sactiver). Une valeur sup\u00e9rieure \u00e0 z\u00e9ro doit \u00eatre d'au moins 1 milliseconde.
