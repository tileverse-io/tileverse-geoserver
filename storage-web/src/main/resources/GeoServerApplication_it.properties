StorageUriValidator.invalidUri=Posizione di archiviazione non riconosciuta. Utilizzare un percorso locale, un URI file:, un URL http(s): o un URI con uno schema supportato da un provider di archiviazione (ad es. s3:, gs:, azure:).

# Tooltips of the storage parameters. The English ones are the descriptions declared by tileverse-storage.
storage.caching.enabled.tooltip=Abilita la cache in memoria degli intervalli di byte grezzi. Un intervallo memorizzato nella cache viene servito di nuovo senza accedere all'origine, e le richieste simultanee dello stesso intervallo tramite uno stesso lettore condividono un unico recupero. Disattivata per impostazione predefinita.
storage.http.timeout-millis.tooltip=Specifica il tempo massimo di attesa per stabilire una connessione al server HTTP.\nIl valore predefinito \u00e8 5000 millisecondi (5 secondi). Aumentare questo valore per reti lente o inaffidabili.
storage.http.trust-all-certificates.tooltip=Se impostato su true, disabilita la convalida dei certificati SSL/TLS, consentendo le connessioni a server\ncon certificati autofirmati o non validi. Da utilizzare SOLO in ambienti di\nsviluppo/test. Il valore predefinito \u00e8 false (convalida dei certificati abilitata).
storage.http.username.tooltip=Nome utente per l'autenticazione HTTP Basic. Deve essere utilizzato insieme al parametro della password per l'autenticazione HTTP Basic.
storage.http.password.tooltip=Password per l'autenticazione HTTP Basic. Deve essere utilizzata insieme al parametro del nome utente per l'autenticazione HTTP Basic.
storage.http.bearer-token.tooltip=Token bearer per l'autenticazione OAuth 2.0 o JWT. Il token viene inviato con ogni richiesta utilizzando il formato di intestazione "Authorization: Bearer <token>".\n\nComunemente utilizzato con le API REST moderne e i servizi cloud.
storage.http.api-key-headername.tooltip=Il nome dell'intestazione HTTP da utilizzare per l'autenticazione con chiave API (ad es. "X-API-Key", "Authorization", "api-key"). Deve essere utilizzato insieme al parametro api-key.\n\nComune nelle API REST che utilizzano un'autenticazione basata su intestazioni personalizzate.
storage.http.api-key.tooltip=Il valore della chiave API da inviare nell'intestazione personalizzata. Deve essere utilizzato insieme al parametro api-key-headername. Pu\u00f2 facoltativamente includere un prefisso specificato dal parametro "Prefisso del valore della chiave API" (ad es. "ApiKey " o "Token ").
storage.http.api-key-value-prefix.tooltip=Prefisso facoltativo per il valore della chiave API (ad es. "ApiKey ", "Token "). Se specificato, questo prefisso viene anteposto alla chiave API prima di inviarla nell'intestazione.\n\nEsempio: il prefisso "ApiKey " con la chiave "abc123" produce il valore di intestazione "ApiKey abc123".
storage.s3.force-path-style.tooltip=Se abilitato, le richieste utilizzano l'indirizzamento in stile percorso (ad es. https://s3.amazonaws.com/bucket/key).\n\nSe disabilitato, viene utilizzato invece l'indirizzamento in stile hosting virtuale (ad es. https://bucket.s3.amazonaws.com/key).\n\nPu\u00f2 essere utile per la compatibilit\u00e0 con i sistemi di archiviazione compatibili con S3 che non supportano le richieste in stile hosting virtuale.\n\nSenza un valore, si usa lo stile percorso quando \u00e8 in vigore un endpoint personalizzato (storage.s3.endpoint, l'host di un URL http(s) di un servizio compatibile con S3 come MinIO, o un endpoint indicato dall'ambiente AWS come AWS_ENDPOINT_URL), e lo stile hosting virtuale su AWS. Impostare questo parametro per sovrascrivere questa scelta.
storage.s3.requester-pays.tooltip=Se abilitato, ogni richiesta S3 aggiunge l'intestazione x-amz-request-payer: requester, in modo che i costi di trasferimento dati in uscita e i costi per operazione vengano addebitati al richiedente (anzich\u00e9 al proprietario del bucket).\n\nNecessario per accedere ai bucket configurati con il modello di fatturazione Requester Pays. Senza l'intestazione, tali bucket rispondono con 403 Forbidden. Tra gli esempi figurano diversi set di dati AWS Open Data e NOAA (ad es. s3://noaa-nexrad-level2/).\n\nL'autenticazione \u00e8 obbligatoria: AWS rifiuta le richieste anonime (non firmate) verso i bucket Requester Pays, poich\u00e9 AWS utilizza l'identit\u00e0 che firma la richiesta per determinare l'account a cui addebitare i costi. Combinare questo flag con credenziali reali (catena di credenziali predefinita, profilo denominato oppure chiave di accesso e chiave segreta statiche) e non combinarlo con storage.s3.anonymous=true.\n\nIl flag non ha alcun effetto sui bucket normali; l'intestazione viene ignorata senza alcuna segnalazione.
storage.s3.endpoint.tooltip=Sovrascrive l'endpoint del servizio S3 per consentire a un URI canonico s3://bucket/key di puntare a un servizio non AWS compatibile con S3 (ad es. http://localhost:9000 per MinIO, https://<account>.r2.cloudflarestorage.com per Cloudflare R2, https://<region>.digitaloceanspaces.com per DigitalOcean Spaces).\n\nIl valore \u00e8 la radice del servizio (schema, host e porta facoltativa) senza bucket n\u00e9 chiave, ad esempio http://localhost:9000.\n\nSe impostato, ha la precedenza su qualsiasi endpoint dedotto da un URI di base http(s)://host/bucket/key. In mancanza di entrambi, l'archivio usa l'endpoint indicato dall'ambiente AWS: la propriet\u00e0 di sistema 'aws.endpointUrlS3' o 'aws.endpointUrl', la variabile di ambiente 'AWS_ENDPOINT_URL_S3' o 'AWS_ENDPOINT_URL', quindi 'endpoint_url' nei file di profilo AWS. Senza nessuno di questi, l'archivio utilizza gli endpoint AWS predefiniti della sua regione.\n\nPoich\u00e9 gli endpoint personalizzati richiedono quasi sempre l'indirizzamento in stile percorso, con un endpoint personalizzato proveniente da una qualsiasi di queste fonti il valore predefinito di storage.s3.force-path-style diventa true. Impostare esplicitamente storage.s3.force-path-style per sovrascriverlo.
storage.s3.region.tooltip=La regione AWS del bucket, ad esempio us-west-2.\n\nSe non \u00e8 specificata, un archivio su AWS ricava la regione dalla prima di queste fonti:\n\n* l'URL, quando il suo host o il nome del bucket contiene una regione;\n* la propriet\u00e0 di sistema 'aws.region', poi la variabile di ambiente 'AWS_REGION';\n* i file di profilo AWS: il profilo delle credenziali dell'archivio, altrimenti il profilo indicato da 'AWS_PROFILE' o 'default';\n* il servizio di metadati di EC2, per un archivio che usa la catena di credenziali predefinita di AWS;\n* us-east-1.\n\nUna richiesta che raggiunge la regione sbagliata viene inviata di nuovo alla regione del bucket. Gli URL prefirmati non vengono corretti: richiedono la regione giusta.\n\nUn archivio con un endpoint di servizio (vedere storage.s3.endpoint) ignora la regione dell'ambiente: la sua regione serve solo a firmare le richieste ed \u00e8 us-east-1, a meno che l'URL o questo parametro non ne indichino una. Cloudflare R2 si aspetta 'auto'.
storage.s3.anonymous.tooltip=Se \u00e8 true, il client dell'SDK S3 viene creato con AnonymousCredentialsProvider, quindi le richieste non vengono firmate. Da utilizzare per i bucket pubblici che consentono letture anonime (ad es. Overture Maps, AWS Open Data). Ha la precedenza sulla chiave di accesso e sulla chiave segreta, sul profilo e sulla catena di credenziali predefinita.
storage.s3.aws-access-key-id.tooltip=L'ID chiave di accesso AWS utilizzato per firmare le richieste, insieme alla chiave di accesso segreta; una chiave senza l'altra viene ignorata. L'accesso anonimo ha la precedenza sulle chiavi.\n\nSenza le chiavi, le richieste utilizzano il profilo delle credenziali, se ne \u00e8 indicato uno, altrimenti la catena di provider di credenziali predefinita di AWS.
storage.s3.aws-secret-access-key.tooltip=La chiave di accesso segreta AWS utilizzata per firmare le richieste, insieme all'ID chiave di accesso; una chiave senza l'altra viene ignorata. L'accesso anonimo ha la precedenza sulle chiavi.\n\nSenza le chiavi, le richieste utilizzano il profilo delle credenziali, se ne \u00e8 indicato uno, altrimenti la catena di provider di credenziali predefinita di AWS.
storage.s3.default-credentials-profile.tooltip=Il nome di un profilo nel file delle credenziali AWS (in genere ~/.aws/credentials) o nel file di configurazione AWS (in genere ~/.aws/config). Le richieste utilizzano solo quel profilo, qualunque cosa imposti l'ambiente. L'accesso anonimo e le chiavi di accesso hanno la precedenza su di esso.\n\nSenza un profilo, le chiavi di accesso o l'accesso anonimo, la catena di provider di credenziali predefinita di AWS risolve le credenziali: propriet\u00e0 di sistema, variabili di ambiente, un token di identit\u00e0 Web, il profilo indicato da AWS_PROFILE (o 'default'), le credenziali del container e infine il profilo dell'istanza EC2.
storage.gcs.project-id.tooltip=L'ID progetto \u00e8 un identificatore univoco, definito dall'utente, di un progetto Google Cloud.\n\nSe non \u00e8 impostato alcun ID progetto, si tenta di ottenere dall'ambiente un ID progetto predefinito.\n\nL'ID progetto predefinito \u00e8 il primo ID progetto disponibile tra le seguenti origini:\n1. L'ID progetto specificato dalla variabile di ambiente GOOGLE_CLOUD_PROJECT\n2. L'ID progetto di App Engine\n3. L'ID progetto specificato nel file JSON delle credenziali indicato dalla variabile di ambiente GOOGLE_APPLICATION_CREDENTIALS\n4. L'ID progetto di Google Cloud SDK\n5. L'ID progetto di Compute Engine
storage.gcs.quota-project-id.tooltip=Il progetto a cui vengono addebitate la quota e la fatturazione delle chiamate API, ad esempio quando ci si autentica con credenziali utente tramite le Application Default Credentials. Sovrascrive il quota_project_id del file delle credenziali.\n\nIl chiamante deve disporre dell'autorizzazione serviceusage.services.use sul progetto. I bucket Requester Pays addebitano invece i costi al progetto indicato nel parametro del progetto utente.
storage.gcs.anonymous.tooltip=Se \u00e8 true, le richieste non vengono firmate: non viene cercata n\u00e9 inviata alcuna credenziale. Da utilizzare per i bucket pubblici che consentono letture anonime e per gli emulatori come fake-gcs-server. Ha la precedenza sulle Application Default Credentials.\n\nSe \u00e8 false, le richieste vengono autenticate dalle Application Default Credentials; l'apertura di uno Storage non riesce se non ne viene trovata nessuna. Per configurarle, vedere https://cloud.google.com/docs/authentication/external/set-up-adc
storage.gcs.user-project.tooltip=ID progetto a cui addebitare le operazioni su un bucket Requester Pays. Se impostato, il valore viene allegato a ogni richiesta come opzione userProject (parametro URL); i bucket in modalit\u00e0 Requester Pays rifiutano le richieste che ne sono prive con 400 UserProjectMissing.\n\nL'autenticazione \u00e8 obbligatoria: il richiedente deve essere un'entit\u00e0 autenticata (account di servizio o utente finale) che dispone dell'autorizzazione serviceusage.services.use sul progetto di fatturazione indicato. Le richieste anonime non possono soddisfare tale requisito: lasciare storage.gcs.anonymous disattivato per autenticarsi con le Application Default Credentials.
storage.gcs.endpoint.tooltip=Endpoint personalizzato per server compatibili con GCS (ad es. fake-gcs-server: http://localhost:4443). Se impostato, l'SDK si rivolge a questo endpoint anzich\u00e9 all'endpoint pubblico di Google. Il valore \u00e8 un URL completo dell'endpoint, comprensivo di schema, non un semplice nome host. Le credenziali seguono storage.gcs.anonymous come per l'endpoint predefinito: per gli emulatori deve essere impostato.
storage.azure.blob-name.tooltip=Imposta il percorso del blob (ad es. /path/to/file.pmtiles).\n\nSe l'URL dell'endpoint punta a un blob nel contenitore radice, l'analisi non riesce perch\u00e9 il nome del blob viene interpretato come nome del contenitore. Con un solo elemento di percorso \u00e8 impossibile distinguere tra il nome di un contenitore e un blob nel contenitore radice, quindi si presume che sia il nome del contenitore, poich\u00e9 questo caso \u00e8 molto pi\u00f9 comune\n\nQuando si lavora con blob nel contenitore radice, \u00e8 preferibile impostare l'endpoint sull'URL dell'account e specificare il nome del blob separatamente tramite questo parametro.
storage.azure.anonymous.tooltip=Se \u00e8 true, il client dell'SDK di Azure viene creato senza alcuna credenziale. Da utilizzare per i contenitori pubblici configurati con accesso anonimo a livello di contenitore o di blob. Ha la precedenza su connection-string, account-key, sas-token e sulla catena di credenziali predefinita.
storage.azure.account-key.tooltip=La chiave di accesso dell'account utilizzata per autenticare la richiesta.\n\nSe specificata, il nome dell'account ottenuto dall'URI viene utilizzato con questa chiave di accesso per creare un criterio di credenziali SharedKey, che viene inserito in un'intestazione per autorizzare le richieste
storage.azure.sas-token.tooltip=Firma di accesso condiviso (Shared Access Signature), un token di sicurezza generato sul lato client per concedere un accesso limitato e delegato alle risorse di Azure.\n\nQuesto token pu\u00f2 trovarsi anche nella stringa di query dell'URL del blob.
storage.azure.connection-string.tooltip=Stringa di connessione completa (DefaultEndpointsProtocol=...;AccountName=...;AccountKey=...;EndpointSuffix=...). Se impostata, ha la precedenza su account-key, sas-token e sulla catena di credenziali predefinita. Comune per Azurite e per lo sviluppo locale.
storage.azure.endpoint.tooltip=Sovrascrive l'URL dell'endpoint del servizio Blob per consentire a un URI in forma breve az://account/container di puntare a un emulatore, a un cloud sovrano o a un dominio personalizzato anzich\u00e9 all'endpoint pubblico https://<account>.blob.core.windows.net.\n\nIl valore \u00e8 l'endpoint completo del servizio Blob, incluso l'account nei casi in cui il servizio lo prevede nel percorso. Per l'emulatore Azurite \u00e8 http://127.0.0.1:10000/devstoreaccount1; per Azure Government \u00e8 https://<account>.blob.core.usgovcloudapi.net.\n\nSe impostato, sostituisce l'endpoint derivato dall'URI. Poich\u00e9 le forme di URI https:// e abfs(s):// codificano gi\u00e0 l'endpoint nel proprio host, questo parametro \u00e8 utile soprattutto per la forma breve az://. Lasciarlo non impostato per utilizzare l'endpoint pubblico di Azure per l'account.
storage.azure.max-retries.tooltip=Numero massimo di nuovi tentativi per le richieste dell'SDK di Azure non riuscite. Valore predefinito: 3.
storage.azure.retry-delay.tooltip=Ritardo iniziale prima del primo nuovo tentativo; raddoppia a ogni nuovo tentativo successivo, fino a max-retry-delay. Durata ISO-8601. Valore predefinito: PT4S.
storage.azure.max-retry-delay.tooltip=Limite superiore del ritardo di backoff tra i tentativi. Durata ISO-8601. Valore predefinito: PT2M (120s).
storage.azure.try-timeout.tooltip=Timeout per ogni singolo tentativo di richiesta. Durata ISO-8601. Valore predefinito: PT60S.
storage.file.idle-timeout.tooltip=Timeout di inattivit\u00e0, trascorso il quale un FileRangeReader chiude il FileChannel sottostante per rilasciare i descrittori di file. Il canale viene riaperto su richiesta alla lettura successiva. Formato di durata ISO-8601 (ad es. PT60S per 60 secondi, PT0S per disabilitare). Un valore superiore a zero deve essere di almeno 1 millisecondo.
