name: GeoServer Demo Smoke Test

on:
  # The plugin depends transitively on parquetry-core, -format, -io and
  # -tileverse-storage; a change anywhere in the code can break the demo. Run on any
  # change except docs, rather than only on the geoserver/geotools modules.
  pull_request:
    branches: [main, '[0-9]+.[0-9]+.x']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [main, '[0-9]+.[0-9]+.x']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=2

jobs:
  demo-smoke:
    name: Build and exercise the demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on a merge commit: validation already ran during the PR.
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'Merge pull request #')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Reads the GeoParquet and Arrow IPC responses back in the output-format smoke checks.
      - name: Set up DuckDB
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          sudo unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version
          # read_arrow ships in the arrow extension, and decoding geometry needs spatial.
          # The smoke scripts install both themselves; doing it here too fails fast, before
          # the demo image build, when the extension repository is unreachable. Parquet
          # itself is built into the CLI.
          duckdb -c "install arrow; install spatial"
        env:
          DUCKDB_VERSION: v1.5.5

      # Builds the plugin zips (./mvnw), builds the image (downloads GeoServer + Java 25 base),
      # and starts GeoServer + the s3proxy emulator via docker compose.
      - name: Build and start the demo
        run: make demo-up

      - name: Wait for GeoServer to be healthy
        run: |
          for i in $(seq 1 72); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tileverse-geoserver-demo 2>/dev/null || echo starting)
            echo "attempt $i: health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "GeoServer did not become healthy in time"
          exit 1

      # The checks live in demo/smoke/ as shell scripts, runnable against a local demo with
      # `make demo-smoke`. Keeping them out of this file means a failure can be reproduced
      # without re-running the workflow.
      - name: Smoke test (core services)
        run: demo/smoke/core.sh

      - name: Smoke test (GeoParquet output format)
        run: demo/smoke/geoparquet.sh

      - name: Smoke test (Arrow IPC output format)
        run: demo/smoke/arrow-ipc.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f demo/docker-compose.yml logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: make demo-down
